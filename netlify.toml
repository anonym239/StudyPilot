[build]
  command = "pnpm --filter @workspace/studypilot run build"
  publish = "artifacts/studypilot/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "22"
  PNPM_VERSION = "10.26.1"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200